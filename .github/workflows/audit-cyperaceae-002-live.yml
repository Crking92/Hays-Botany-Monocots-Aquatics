name: Audit Cyperaceae_002 on real family GitHub Pages
on:
  push:
    branches: [main]
    paths:
      - 'workflow/cyperaceae-002-live-audit-20261104.txt'
      - '.github/workflows/audit-cyperaceae-002-live.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cyperaceae-002-live-photo-audit
  cancel-in-progress: false
jobs:
  audit-all-photos:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            site/data
            site/media/fimbristylis-vahlii
            site/media/fuirena-simplex
            site/media/rhynchospora-colorata
            site/media/rhynchospora-nivea
            site/media/schoenoplectus-californicus
            site/media/schoenoplectus-tabernaemontani
      - name: Confirm all source-cleared Cyperaceae_002 photos are linked with credits and real files
        run: |
          python3 - <<'PY'
          import json,pathlib,hashlib
          root=pathlib.Path("site")
          group={"fimbristylis-vahlii":5,"fuirena-simplex":5,"rhynchospora-colorata":5,"rhynchospora-nivea":5,"schoenoplectus-californicus":5,"schoenoplectus-tabernaemontani":5}
          count=0
          for sid,expected in group.items():
              photos=json.loads((root/"data/species"/(sid+".json")).read_text())["verified_photos"]
              batch=[p for p in photos if p["src"].split("/")[-1].startswith(("photo_","gbif-"))]
              assert len(batch)==expected,(sid,len(batch))
              for p in batch:
                  img=root/p["src"]
                  assert img.is_file() and p.get("creator") and p.get("license_url") and p.get("source_page"),p["src"]
                  b=img.read_bytes()
                  assert hashlib.sha1(b"blob "+str(len(b)).encode()+b"\0"+b).hexdigest()==p["source_blob_sha"],p["src"]
              count+=len(batch)
          assert count==30,count
          print("CYPERACEAE_002_IN_GITHUB_SITE_SOURCE",count)
          PY
      - name: Independently fetch all 30 new photos and credited cards from actual family Pages
        run: |
          python3 - <<'PY'
          import concurrent.futures,hashlib,json,pathlib,time,urllib.request
          from urllib.error import URLError,HTTPError
          site=pathlib.Path("site")
          base="https://crking92.github.io/Hays-Botany-Monocots-Aquatics/site/"
          group={"fimbristylis-vahlii":5,"fuirena-simplex":5,"rhynchospora-colorata":5,"rhynchospora-nivea":5,"schoenoplectus-californicus":5,"schoenoplectus-tabernaemontani":5}
          def get(rel):
              url=base+rel
              req=urllib.request.Request(url,headers={"User-Agent":"HaysBotany-Cyperaceae-002-LivePhotoQA/1.0","Cache-Control":"no-cache"})
              with urllib.request.urlopen(req,timeout=35) as response:
                  assert response.status==200,(rel,response.status)
                  return response.read()
          expected=(site/"data/gallery-index.json").read_bytes()
          for attempt in range(35):
              try:
                  if get("data/gallery-index.json")==expected:
                      print("PUBLIC_GALLERY_INDEX_IS_CURRENT",flush=True)
                      break
              except (URLError,HTTPError,OSError) as error:
                  print("Pages index not ready",str(error),flush=True)
              time.sleep(10)
          else:
              raise AssertionError("Public Pages gallery index not updated")
          expected_items=[]
          for sid,limit in group.items():
              local=(site/"data/species"/(sid+".json")).read_bytes()
              published=get("data/species/"+sid+".json")
              assert hashlib.sha256(local).digest()==hashlib.sha256(published).digest(),sid
              card=json.loads(published)
              photos=[p for p in card["verified_photos"] if p["src"].split("/")[-1].startswith(("photo_","gbif-"))]
              assert len(photos)==limit,(sid,len(photos))
              for p in photos:
                  assert p.get("creator") and p.get("source_page") and p.get("license") and p.get("license_url"),p["src"]
                  expected_items.append(p["src"])
          def verify(rel):
              local=(site/rel).read_bytes()
              live=get(rel)
              assert hashlib.sha256(local).digest()==hashlib.sha256(live).digest(),rel
              return rel
          with concurrent.futures.ThreadPoolExecutor(max_workers=6) as pool:
              results=list(pool.map(verify,expected_items))
          assert len(results)==30
          print("CYPERACEAE_002_LIVE_BYTES_AND_CREDITS_VERIFIED",len(results),flush=True)
          PY
