name: Audit Cyperaceae_002 on real family GitHub Pages
on:
  push:
    branches: [main]
    paths:
      - 'workflow/cyperaceae-002-live-audit-20261104.txt'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cyperaceae-002-live-photo-audit
  cancel-in-progress: false
jobs:
  audit-all-photos:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Confirm all source-cleared Cyperaceae_002 photos are linked with credits and real files
        run: |
          python3 - <<'PY'
          import json,pathlib,hashlib
          root=pathlib.Path("site")
          group={"fimbristylis-vahlii":5,"fuirena-simplex":5,"rhynchospora-colorata":5,"rhynchospora-nivea":5,"schoenoplectus-californicus":5,"schoenoplectus-tabernaemontani":5}
          count=0
          for sid,expected in group.items():
              photos=json.loads((root/"data/species"/(sid+".json")).read_text())["verified_photos"]
              batch=[p for p in photos if p["src"].split("/")[-1].startswith(("photo_","gbif-"))]
              assert len(batch)==expected,(sid,len(batch))
              for p in batch:
                  img=root/p["src"]
                  assert img.is_file() and p.get("creator") and p.get("license_url") and p.get("source_page"),p["src"]
                  b=img.read_bytes()
                  assert hashlib.sha1(b"blob "+str(len(b)).encode()+b"\0"+b).hexdigest()==p["source_blob_sha"],p["src"]
              count+=len(batch)
          assert count==30,count
          print("CYPERACEAE_002_IN_GITHUB_SITE_SOURCE",count)
          PY
      - name: Verify all public family galleries and every image against actual GitHub Pages
        run: python3 scripts/verify_existing_site.py --live https://crking92.github.io/Hays-Botany-Monocots-Aquatics/site/
