name: Transfer existing family source files privately — no new photos or publication
on:
  push:
    branches: [main]
    paths:
      - 'scripts/transfer_existing_originals_private.py'
      - '.github/workflows/private-originals-transfer.yml'
  workflow_dispatch:
permissions: {contents: write}
concurrency:
  group: original-source-private-transfer
  cancel-in-progress: false
jobs:
  preserve:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout transfer script in family repository
        uses: actions/checkout@v4
        with:
          ref: main
          path: script
          persist-credentials: false
      - name: Checkout private family staging base
        uses: actions/checkout@v4
        with:
          ref: main
          path: staged
          persist-credentials: true
      - name: Create private staging branch with no deployment configuration changes
        shell: bash
        run: |
          set -euo pipefail
          git -C staged switch -c staging/originals-transfer
          python3 -m py_compile script/scripts/transfer_existing_originals_private.py
      - name: Clone only the assigned family content from original Hays Botany
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none --depth 1 --sparse --no-checkout \
            https://github.com/Crking92/Hays-County-Botany.git \
            "$RUNNER_TEMP/hays-source"
          python3 - <<'PY' > "$RUNNER_TEMP/source-family-paths.txt"
          import json
          c=json.load(open('staged/config/collection.json'))
          for f in c['family_assignments']:
              print('content/taxa/'+f)
          PY
          git -C "$RUNNER_TEMP/hays-source" sparse-checkout set --stdin < "$RUNNER_TEMP/source-family-paths.txt"
          git -C "$RUNNER_TEMP/hays-source" checkout HEAD
      - name: Transfer original files byte-exact; hide all original media from public learner
        shell: bash
        run: |
          set -euo pipefail
          python3 script/scripts/transfer_existing_originals_private.py staged "$RUNNER_TEMP/hays-source"
          python3 staged/scripts/validate_collection.py
      - name: Push audited transfer to private branch only
        shell: bash
        run: |
          set -euo pipefail
          git -C staged push origin HEAD:refs/heads/staging/originals-transfer
      - name: Preserve summary only, never attach or deploy held original photos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: existing-originals-private-preservation-report
          path: staged/migration/original-file-transfer-summary.json
          retention-days: 30
          if-no-files-found: warn
