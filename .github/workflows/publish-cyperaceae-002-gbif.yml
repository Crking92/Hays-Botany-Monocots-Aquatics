name: Verify and publish exact-source Cyperaceae_002 herbarium photographs
on:
  push:
    branches: [main]
    paths:
      - 'photo-intake/remote-candidates/Cyperaceae_002_GBIF.tsv'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
concurrency:
  group: cyperaceae-002-photo-first
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Install Pillow
        run: python3 -m pip install --disable-pip-version-check Pillow==11.3.0
      - name: Verify exact institutional source and image rights
        run: |
          python3 scripts/publish_verified_cyperaceae_002_gbif.py \
            --manifest photo-intake/remote-candidates/Cyperaceae_002_GBIF.tsv \
            --site-root site \
            --report "$RUNNER_TEMP/cyperaceae-002-gbif-result.json"
      - name: Validate all public gallery records
        run: python3 scripts/verify_automatic_gallery.py --site-root site
      - name: Commit only cleared photos and their credits
        id: release
        run: |
          mkdir -p photo-intake/remote-results
          cp "$RUNNER_TEMP/cyperaceae-002-gbif-result.json" photo-intake/remote-results/Cyperaceae_002_GBIF.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/media site/data/collection-index.json site/data/gallery-index.json site/data/species photo-intake/remote-results/Cyperaceae_002_GBIF.json
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git diff --cached --check
          git commit -m "Install source-verified Cyperaceae_002 herbarium specimens and credit audit"
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Rebuild public Pages
        if: steps.release.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/${{ github.repository }}/pages/builds"
