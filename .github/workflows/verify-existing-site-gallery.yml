name: Verify existing Monocots-Aquatics public gallery and site bytes
on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'scripts/verify_existing_site.py'
      - '.github/workflows/verify-existing-site-gallery.yml'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  audit-existing:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check all 113 species and every archived-source photo hash
        run: python3 scripts/verify_existing_site.py
      - name: Wait for public website gallery index to reflect the current repository
        run: |
          python3 - <<'PY'
          import json,time,urllib.request
          from pathlib import Path
          root=Path("site/data")
          expected={p:(root/p).read_bytes() for p in ("gallery-index.json","collection-meta.json","collection-index.json")}
          base="https://crking92.github.io/Hays-Botany-Monocots-Aquatics/site/data/"
          for attempt in range(30):
              try:
                  matched=True
                  for name,bytes_expected in expected.items():
                      request=urllib.request.Request(base+name+"?check="+str(attempt),headers={"User-Agent":"HaysBotanyPagesGalleryAudit/1.0"})
                      with urllib.request.urlopen(request,timeout=20) as response:
                          if response.read()!=bytes_expected:
                              matched=False
                              break
                  if matched:
                      print("LIVE_GALLERY_AND_SITE_METADATA_MATCH")
                      break
              except Exception as exc:
                  print("Pages gallery update not yet confirmed",repr(exc))
              time.sleep(10)
          else:
              raise SystemExit("Public gallery did not reach expected photo counts")
          PY
      - name: Confirm live Pages serves every species JSON and every published photograph
        run: python3 scripts/verify_existing_site.py --live https://crking92.github.io/Hays-Botany-Monocots-Aquatics/site/
